<main class="mx-auto min-h-screen max-w-3xl px-6 py-10">
  <h1 class="font-serif text-4xl tracking-tight">Welcome to the Host App</h1>

  <nav class="mt-6 flex w-fit gap-2 rounded-full bg-amber-500 p-1.5" aria-label="Pages">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive
        #link="routerLinkActive"
        [routerLinkActiveOptions]="{ exact: true }"
        [attr.aria-current]="link.isActive ? 'page' : null"
        class="cursor-pointer rounded-full px-4 py-2 text-sm font-medium"
        [class.bg-white]="link.isActive"
        [class.text-stone-900]="link.isActive"
        [class.text-stone-800]="!link.isActive"
      >
        {{ item.label }}
      </a>
    }
  </nav>

  <section class="mt-8">
    <router-outlet />
  </section>
</main>
