<main class="mx-auto min-h-screen max-w-3xl px-6 py-10">
  <h1 class="font-serif text-4xl tracking-tight">Welcome to the Host App</h1>

  <nav class="mt-6 flex w-fit gap-2 rounded-full bg-amber-500 p-1.5" aria-label="Pages">
    @for (item of nav; track item.id) {
      <button
        type="button"
        (click)="show(item.id)"
        [attr.aria-current]="view() === item.id ? 'page' : null"
        class="cursor-pointer rounded-full px-4 py-2 text-sm font-medium"
        [class.bg-white]="view() === item.id"
        [class.text-stone-900]="view() === item.id"
        [class.text-stone-800]="view() !== item.id"
      >
        {{ item.label }}
      </button>
    }
  </nav>

  <section class="mt-8 grid gap-4">
    <div [hidden]="view() === 'announcements'">
      <div #users></div>
    </div>
    <div [hidden]="view() === 'users'">
      <div #announcements></div>
    </div>
  </section>
</main>
